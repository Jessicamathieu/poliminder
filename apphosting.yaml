# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
# Specifies the entrypoint for your App Hosting backend.
# This is the command that will be used to start your web server.
entrypoint: node server.js
# App Hosting's build process will automatically detect and run `npm run build`.
# If you need to disable this behavior, you can do so here.
# build:
#   enabled: false
